<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Parser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        .dragover { border-color: #4f46e5 !important; background: #eef2ff !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 leading-relaxed font-sans">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <h1 class="text-center text-3xl font-bold text-indigo-600 mb-1">📄 Resume Parser</h1>
        <p class="text-center text-slate-500 mb-8">Upload a resume (PDF or DOCX) to extract candidate details automatically</p>

        <!-- Upload Area -->
        <div id="drop-zone"
             class="bg-white border-2 border-dashed border-slate-200 rounded-xl p-10 text-center mb-8
                    transition-colors hover:border-indigo-600">
            <div class="text-5xl mb-2">⬆️</div>
            <p class="text-slate-500 mb-4">Drag & drop a resume here, or click to browse</p>
            <input type="file" id="file-input" accept=".pdf,.docx" class="hidden">
            <button onclick="document.getElementById('file-input').click()"
                    class="inline-block px-6 py-2.5 bg-indigo-600 text-white font-semibold rounded-lg
                           hover:bg-indigo-700 active:scale-[0.97] transition">
                Choose File
            </button>
            <div id="file-name" class="mt-3 text-sm text-slate-500"></div>
            <div class="mt-4">
                <button id="upload-btn" onclick="uploadResume()" style="display:none"
                        class="inline-block px-6 py-2.5 bg-indigo-600 text-white font-semibold rounded-lg
                               hover:bg-indigo-700 active:scale-[0.97] transition">
                    Parse Resume
                </button>
            </div>
        </div>

        <!-- Status -->
        <div id="status" class="hidden rounded-lg p-4 mb-6 font-medium"></div>

        <!-- Search -->
        <div class="flex gap-3 mb-6">
            <input type="text" id="search-input" placeholder="Search by name, email, or skill..."
                   onkeyup="handleSearch(event)"
                   class="flex-1 px-4 py-2.5 border border-slate-200 rounded-lg text-sm
                          outline-none focus:border-indigo-600 transition">
            <button onclick="searchCandidates()"
                    class="px-6 py-2.5 bg-indigo-600 text-white font-semibold rounded-lg
                           hover:bg-indigo-700 active:scale-[0.97] transition">
                Search
            </button>
        </div>

        <!-- Results -->
        <div id="candidates-list"></div>
    </div>

    <script>
        const dropZone  = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileName  = document.getElementById('file-name');
        const uploadBtn = document.getElementById('upload-btn');
        const statusDiv = document.getElementById('status');
        const listDiv   = document.getElementById('candidates-list');

        // Drag & drop
        ['dragenter', 'dragover'].forEach(e => {
            dropZone.addEventListener(e, ev => { ev.preventDefault(); dropZone.classList.add('dragover'); });
        });
        ['dragleave', 'drop'].forEach(e => {
            dropZone.addEventListener(e, ev => { ev.preventDefault(); dropZone.classList.remove('dragover'); });
        });
        dropZone.addEventListener('drop', ev => {
            const files = ev.dataTransfer.files;
            if (files.length) { fileInput.files = files; onFileSelected(); }
        });
        fileInput.addEventListener('change', onFileSelected);

        function onFileSelected() {
            if (fileInput.files.length) {
                fileName.textContent = '📁 ' + fileInput.files[0].name;
                uploadBtn.style.display = 'inline-block';
            }
        }

        function setStatus(type, msg) {
            statusDiv.className = 'rounded-lg p-4 mb-6 font-medium border';
            const styles = {
                success: 'bg-green-50 text-green-600 border-green-200',
                error:   'bg-red-50 text-red-600 border-red-200',
                loading: 'bg-indigo-50 text-indigo-600 border-indigo-200'
            };
            statusDiv.className += ' ' + (styles[type] || '');
            const spinner = type === 'loading'
                ? '<span class="inline-block w-4 h-4 border-2 border-slate-200 border-t-indigo-600 rounded-full mr-2 align-middle" style="animation:spin .6s linear infinite"></span>'
                : '';
            statusDiv.innerHTML = spinner + msg;
        }

        function clearStatus() { statusDiv.className = 'hidden'; statusDiv.innerHTML = ''; }

        async function uploadResume() {
            if (!fileInput.files.length) return;
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            setStatus('loading', 'Parsing resume...');
            uploadBtn.disabled = true;

            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (res.ok) {
                    setStatus('success', '✅ ' + data.message);
                    fileInput.value = '';
                    fileName.textContent = '';
                    uploadBtn.style.display = 'none';
                    loadCandidates();
                } else {
                    setStatus('error', '❌ ' + data.error);
                }
            } catch (err) {
                setStatus('error', '❌ Network error: ' + err.message);
            } finally {
                uploadBtn.disabled = false;
            }
        }

        async function loadCandidates() {
            try {
                const res = await fetch('/api/candidates');
                const candidates = await res.json();
                renderCandidates(candidates);
            } catch (err) {
                listDiv.innerHTML = '<div class="empty-state">Failed to load candidates.</div>';
            }
        }

        async function searchCandidates() {
            const q = document.getElementById('search-input').value.trim();

            // Check if it looks like a skill search (comma-separated)
            if (q.includes(',')) {
                try {
                    const res = await fetch('/api/search/skills?skills=' + encodeURIComponent(q));
                    renderCandidates(await res.json());
                } catch (err) { console.error(err); }
                return;
            }

            try {
                const url = q ? '/api/candidates?q=' + encodeURIComponent(q) : '/api/candidates';
                const res = await fetch(url);
                renderCandidates(await res.json());
            } catch (err) { console.error(err); }
        }

        function handleSearch(ev) { if (ev.key === 'Enter') searchCandidates(); }

        async function deleteCandidate(id) {
            if (!confirm('Delete this candidate?')) return;
            try {
                await fetch('/api/candidates/' + id, { method: 'DELETE' });
                loadCandidates();
            } catch (err) { console.error(err); }
        }

        function renderCandidates(candidates) {
            if (!candidates.length) {
                listDiv.innerHTML = '<div class="text-center py-12 text-slate-500">No candidates found. Upload a resume to get started!</div>';
                return;
            }

            const tagColor = { tool: 'bg-amber-100 text-amber-800', database: 'bg-green-100 text-green-800', soft: 'bg-pink-100 text-pink-800' };
            const defaultTag = 'bg-indigo-50 text-indigo-700';

            listDiv.innerHTML = candidates.map(c => `
                <div class="bg-white border border-slate-200 rounded-xl p-6 mb-4 shadow-sm">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <div class="text-xl font-bold text-slate-800">${esc(c.name || 'Unknown')}</div>
                            <div class="text-sm text-slate-500 mt-1 space-x-4">
                                ${c.email ? '<span>📧 ' + esc(c.email) + '</span>' : ''}
                                ${c.phone ? '<span>📱 ' + esc(c.phone) + '</span>' : ''}
                                <span>📁 ${esc(c.filename)}</span>
                            </div>
                        </div>
                        <button onclick="deleteCandidate(${c.id})"
                                class="px-3 py-1.5 bg-red-600 text-white text-xs font-semibold rounded-lg
                                       hover:bg-red-700 active:scale-[0.97] transition">
                            Delete
                        </button>
                    </div>

                    ${c.skills.length ? `
                        <div class="text-xs font-bold uppercase tracking-wide text-slate-500 mt-4 mb-2">Skills</div>
                        <div class="flex flex-wrap gap-1.5">
                            ${c.skills.map(s => `<span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-medium ${tagColor[s.category] || defaultTag}">${esc(s.name)}</span>`).join('')}
                        </div>
                    ` : ''}

                    ${c.education.length ? `
                        <div class="text-xs font-bold uppercase tracking-wide text-slate-500 mt-4 mb-2">Education</div>
                        ${c.education.map(e => `
                            <div class="py-2 border-b border-slate-200 last:border-b-0 text-sm">
                                <span class="font-semibold">${esc(e.degree || '')}</span>
                                ${e.institution ? ' — <span class="text-slate-500">' + esc(e.institution) + '</span>' : ''}
                                ${e.year ? ' <span class="text-xs text-slate-500 italic">(' + esc(e.year) + ')</span>' : ''}
                            </div>
                        `).join('')}
                    ` : ''}

                    ${c.experience.length ? `
                        <div class="text-xs font-bold uppercase tracking-wide text-slate-500 mt-4 mb-2">Experience</div>
                        ${c.experience.map(e => `
                            <div class="py-2 border-b border-slate-200 last:border-b-0 text-sm">
                                <span class="font-semibold">${esc(e.title || '')}</span>
                                ${e.company ? ' at <span class="text-slate-500">' + esc(e.company) + '</span>' : ''}
                                ${e.duration ? '<div class="text-xs text-slate-500 italic">' + esc(e.duration) + '</div>' : ''}
                                ${e.description ? '<div class="text-sm mt-1">' + esc(e.description) + '</div>' : ''}
                            </div>
                        `).join('')}
                    ` : ''}
                </div>
            `).join('');
        }

        function esc(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        // Load on page ready
        loadCandidates();
    </script>
</body>
</html>
